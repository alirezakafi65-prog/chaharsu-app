name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # امکان اجرای دستی از تب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: چک‌اوت کد
        uses: actions/checkout@v4

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'   # در صورت نیاز با نسخه‌ی خودتان جایگزین کنید
          channel: 'stable'

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت APK (Release)
        run: flutter build apk --release

      - name: آپلود APK به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaharsu-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: انتشار به‌عنوان Release در گیت‌هاب
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
